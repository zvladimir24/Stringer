name: Windows Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.7
          cache: true

      - run: flutter pub get

      - run: flutter build windows --release

      - name: Zip release build
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath Stringer-windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Stringer-windows
          path: Stringer-windows.zip

      - name: Publish latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-windows
          name: Latest Windows build
          body: Automatically built from the latest commit on main.
          files: Stringer-windows.zip
